<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="18" y1="12" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2536"/>
      <stop offset="0.55" stop-color="#121826"/>
      <stop offset="1" stop-color="#090C12"/>
    </linearGradient>
    <radialGradient id="glow" cx="66" cy="44" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DE2C3" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7DE2C3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="108" height="108" fill="url(#bg)"/>
  <circle cx="66" cy="44" r="46" fill="url(#glow)"/>

  <!-- trail -->
  <path d="M30,76 L46,62 L58,70 L76,48" fill="none" stroke="#7DE2C3"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- intermediate nodes -->
  <circle cx="46" cy="62" r="4.6" fill="#FFFFFF"/>
  <circle cx="58" cy="70" r="4.6" fill="#FFFFFF"/>

  <!-- start node (hollow) -->
  <circle cx="30" cy="76" r="4.6" fill="#0E141D" stroke="#7DE2C3" stroke-width="4"/>

  <!-- hit ring + hit node -->
  <circle cx="76" cy="48" r="10" fill="none" stroke="#7DE2C3" stroke-width="3" stroke-opacity="0.70"/>
  <circle cx="76" cy="48" r="6" fill="#FFFFFF"/>
</svg>
