<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RegTrail</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <header id="bar">
      <span class="dot"></span>
      <span class="title">RegTrail</span>
      <span class="spacer"></span>
      <button class="icon" id="btn-collapse" title="折叠">&#8211;</button>
      <button class="icon" id="btn-close" title="关闭">&#215;</button>
    </header>

    <nav id="tabs">
      <button class="tab active" data-tab="status">状态</button>
      <button class="tab" data-tab="log">日志</button>
      <button class="tab" data-tab="tools">工具</button>
    </nav>

    <main id="views">
      <!-- Status ------------------------------------------------------- -->
      <section class="view active" data-view="status">
        <dl id="status-list">
          <dt>宿主</dt><dd id="s-package">—</dd>
          <dt>窗口机制</dt><dd id="s-mechanism">—</dd>
          <dt>窗口尺寸</dt><dd id="s-size">—</dd>
          <dt>悬浮窗目标</dt><dd id="s-target-count">—</dd>
          <dt>框架</dt><dd id="s-framework">—</dd>
          <dt>API</dt><dd id="s-api">—</dd>
          <dt>作用域</dt><dd id="s-targets">—</dd>
        </dl>
        <div class="row">
          <button class="action" id="btn-refresh">刷新配置</button>
          <button class="action" id="btn-hide">隐藏</button>
        </div>
        <p class="hint">
          拖动右下角握柄可自由调整窗口大小；折叠后变成可拖动的胶囊，点击展开。
        </p>
      </section>

      <!-- Log ---------------------------------------------------------- -->
      <section class="view" data-view="log">
        <div id="log"></div>
        <div class="row">
          <button class="action" id="btn-clear">清空</button>
          <button class="action" id="btn-copy">复制</button>
        </div>
        <p class="hint" id="log-hint">正在读取模块日志…</p>
      </section>

      <!-- Tools -------------------------------------------------------- -->
      <section class="view" data-view="tools">
        <div class="row">
          <button class="action" id="btn-tools-reload">重载配置</button>
          <button class="action" id="btn-tools-clear">清空日志</button>
        </div>
        <div class="row">
          <button class="action" id="btn-tools-scripts">列出脚本</button>
          <button class="action" id="btn-tools-hide">隐藏窗口</button>
        </div>
        <div id="scripts"></div>
        <p class="status-line" id="tools-status">就绪</p>
      </section>
    </main>

    <!-- Resize affordance. The native side owns the real size: this only drags
         and reports. Hidden by CSS whenever the window is collapsed. -->
    <div id="grip" title="拖动调整窗口大小"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
